name: notify-push

on:
  push:
    branches: [main]
    paths: ["issues.json"]
  workflow_dispatch:
    inputs:
      force:
        description: "号IDが同じでも強制的に通知を送る"
        type: boolean
        default: false
      dry_run:
        description: "検証のみ（認証と本文チェックだけ行い、実際には配信しない）"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check for new issue
        id: check
        run: |
          NEW_ID=$(python3 -c "import json;print(json.load(open('issues.json'))['issues'][0]['id'])")
          OLD_ID=""
          if git rev-parse HEAD^ >/dev/null 2>&1 && git show HEAD^:issues.json > /tmp/prev.json 2>/dev/null; then
            OLD_ID=$(python3 -c "import json;print(json.load(open('/tmp/prev.json'))['issues'][0]['id'])" 2>/dev/null || echo "")
          fi
          echo "new_id=$NEW_ID" >> "$GITHUB_OUTPUT"
          if [ "$NEW_ID" = "$OLD_ID" ] && [ "${{ inputs.force }}" != "true" ]; then
            echo "send=false" >> "$GITHUB_OUTPUT"
            echo "issues[0].id unchanged ($NEW_ID) — skip notification"
          else
            echo "send=true" >> "$GITHUB_OUTPUT"
            echo "will notify for $NEW_ID"
          fi

      - name: Send FCM push
        if: steps.check.outputs.send == 'true'
        env:
          FCM_SERVICE_ACCOUNT: ${{ secrets.FCM_SERVICE_ACCOUNT }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          if [ -z "${FCM_SERVICE_ACCOUNT:-}" ]; then
            echo "::error::secret FCM_SERVICE_ACCOUNT が空です。Settings > Secrets and variables > Actions に登録してください。"
            exit 1
          fi
          python3 -m pip install --quiet --disable-pip-version-check google-auth requests
          python3 - <<'PY'
          import json, os, sys, requests
          from google.oauth2 import service_account
          from google.auth.transport.requests import Request

          dry_run = os.environ.get("DRY_RUN") == "true"

          try:
              sa = json.loads(os.environ["FCM_SERVICE_ACCOUNT"])
          except json.JSONDecodeError as e:
              print(f"::error::secret FCM_SERVICE_ACCOUNT が JSON として読めません: {e}")
              sys.exit(1)

          creds = service_account.Credentials.from_service_account_info(
              sa, scopes=["https://www.googleapis.com/auth/firebase.messaging"])
          try:
              creds.refresh(Request())
          except Exception as e:
              print("::error::サービスアカウントの認証に失敗しました。Firebase 側で鍵が削除・ローテーションされた可能性が高いので、"
                    "新しいキーで secret FCM_SERVICE_ACCOUNT を更新してください: " + str(e))
              sys.exit(1)
          print("認証OK: " + sa["client_email"])

          issue = json.load(open("issues.json"))["issues"][0]
          stories = issue.get("stories", [])
          n = len(stories)
          date = issue.get("date", "")
          try:
              datestr = f"{int(date[5:7])}月{int(date[8:10])}日"
          except Exception:
              datestr = "今日"
          title = f"{datestr}の最新号を配信しました"
          first = stories[0]["title"] if stories else ""
          body = first + (f" ほか計{n}本" if n > 1 else "")

          msg = {"message": {
              "topic": "new-issue",
              "notification": {"title": title, "body": body},
              "apns": {"payload": {"aps": {"sound": "default"}}},
          }}
          if dry_run:
              msg["validate_only"] = True

          r = requests.post(
              f"https://fcm.googleapis.com/v1/projects/{sa['project_id']}/messages:send",
              headers={"Authorization": f"Bearer {creds.token}"},
              json=msg, timeout=30)
          print(r.status_code, r.text[:300])
          if not r.ok:
              print(f"::error::FCM 送信に失敗しました (HTTP {r.status_code}): {r.text[:300]}")
              sys.exit(1)
          if dry_run:
              print(f"::notice::検証のみ成功（配信していません）: {title} / {body}")
          else:
              print(f"::notice::プッシュ通知を送信しました: {title} / {body}")
          PY
